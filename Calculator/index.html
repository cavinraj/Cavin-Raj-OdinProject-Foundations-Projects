<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="calculator.js" type="module" defer></script>

    <style>
        .calculator-button {
            width: 18%;
            height: 23%; /* Reduced from 25% to fix the overflow */
            margin: 5px;
            border-radius: 12px;
            cursor: pointer; /* Good practice for buttons */
            font-size: 2.5rem;
            transition: 0.5s ease;
        }

        .calculator-button:hover {
            background-color: #ddc7a0;
            color: white;
        }

        .operator-button {
            width: 18%;
            height: 23%; /* Reduced from 25% to fix the overflow */
            margin: 5px;
            border-radius: 12px;
            cursor: pointer; /* Good practice for buttons */
            font-size: 2.5rem;
            transition: 0.5s ease;
            background-color: #4169e1;
            color: white;
        }

        .operator-button:hover {
            color: black;
            background-color: rgba(4, 189, 226, 0.905);
        }

        .control-button {
            width: 18%;
            height: 23%; /* Reduced from 25% to fix the overflow */
            margin: 5px;
            border-radius: 12px;
            cursor: pointer; /* Good practice for buttons */
            font-size: 2.5rem;
            transition: 0.3s ease;
            background-color: rgb(218, 145, 0);
            color: white;
        }

        .control-button:hover {
            color: #28231d;
            background-color: rgb(241, 207, 121);
        }

        /* Ensure the image transitions smoothly */
        #back-button img {
            filter: invert(1); 
            transition: 0.5s ease;
        }

        /* When the button is hovered, invert the black pixels to pure white */
        #back-button:hover img {
            filter: invert(0); 
        }

        @font-face {
            font-family: 'CalculatorFont';
            src: url('Technology.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
        }

        #calculator-screen {
            font-family: 'CalculatorFont',sans-serif;
        }

    </style>
</head>

<body>
    <!-- The Calculator Body: Sets the total size and adds a 15px inner bumper -->
    <div id="calculator-body" style="width: 560px; height: 700px; border: 2px solid black; display: flex; flex-direction: column; padding: 20px; align-items: center; border-radius: 12px; box-sizing: border-box;background-color: #28231d;">
        
        <!-- The Screen: Now uses width: 100% to perfectly and symmetrically fill the parent's inner space -->
        <div id="calculator-screen" style="width: 100%; height: 180px; border: 2px solid black; display: flex; justify-content: flex-end; align-items: center; font-size: 3.5rem; padding: 0 15px; overflow: hidden; border-radius: 12px; box-sizing: border-box;background-color: #a2ad9c;"></div>

        <!-- The Calculator Buttons-->
        <div id="button-pad" style="display: flex;flex-wrap: wrap;width: 100%;height: 100%; padding-top: 80px;padding-bottom: 10px; align-content: flex-start;">
            <button id="back-button" class="control-button" >
                <img src="back-arrow.png" style="width: 50%; pointer-events: none;">
            </button>
            <button id="clear-button" class="control-button" >C</button>
            <button id="button-1" class="calculator-button" >1</button>
            <button id="button-2" class="calculator-button" >2</button>
            <button id="button-3" class="calculator-button" >3</button>
            <button id="add-button" class="operator-button" >+</button>
            <button id="subtract-button" class="operator-button" >-</button>
            <button id="button-4" class="calculator-button" >4</button>
            <button id="button-5" class="calculator-button" >5</button>
            <button id="button-6" class="calculator-button" >6</button>
            <button id="mult-button" class="operator-button" >x</button>
            <button id="div-button" class="operator-button" >÷</button>
            <button id="button-7" class="calculator-button" >7</button>
            <button id="button-8" class="calculator-button" >8</button>
            <button id="button-9" class="calculator-button" >9</button>
            <button id="exp-button" class="calculator-button" >𝑥<sup>𝑦</sup></button>
            <button id="open-parentheses-button" class="calculator-button" >(</button>
            <button id="close-parentheses-button" class="calculator-button" >)</button>
            <button id="button-0" class="calculator-button" >0</button>
            <button id="equal-button" class="control-button" >=</button>
        </div>
    </div>
</body>
</html>
